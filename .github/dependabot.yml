version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      radix: { patterns: ['@radix-ui/*'] }
      dev-tooling: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
