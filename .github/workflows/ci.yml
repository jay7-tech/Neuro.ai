name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgres://neuro:neuro@localhost:5432/neuro
  TEST_DATABASE_URL: postgres://neuro:neuro@localhost:5432/neuro_test
  APP_URL: http://localhost:9002
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Migrations are in sync with the schema
        run: npx drizzle-kit check

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: neuro, POSTGRES_PASSWORD: neuro, POSTGRES_DB: neuro_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neuro" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage/, retention-days: 7 }

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [quality, test]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: neuro, POSTGRES_PASSWORD: neuro, POSTGRES_DB: neuro }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neuro" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node dist/migrate.js
      - run: node dist/seed.js
      - name: Start web and worker
        run: |
          RATE_LIMIT_MULTIPLIER=20 npm start > web.log 2>&1 &
          node dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:9002/api/health && break; sleep 1; done
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report/
            web.log
            worker.log

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          {
            context: .,
            target: web,
            push: false,
            tags: 'neuro-ai-web:ci',
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - name: Build worker image
        uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, tags: 'neuro-ai-worker:ci', cache-from: type=gha }
